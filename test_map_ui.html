<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map UI Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #eab308; border-radius: 10px; }
        .safe-area-top { padding-top: 2rem; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen m-0 overflow-hidden relative">

<!-- Simulated Map Modal (Visible for test) -->
<div id="voice-map-modal" class="fixed inset-0 z-[130] bg-black/90 flex flex-col transition-all w-full h-full" role="dialog" aria-modal="true">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 safe-area-top bg-white shadow-md z-10 shrink-0">
        <h3 id="voice-map-title" class="text-lg font-bold text-slate-900 truncate flex-1">Карта библиотек г. Владимира</h3>
        <button type="button" class="p-2 -mr-2 text-slate-500 hover:text-slate-900">
            <span class="material-symbols-outlined text-2xl">close</span>
        </button>
    </div>

    <!-- Yandex Map iframe container -->
    <div class="flex-1 w-full h-full relative overflow-hidden flex flex-col bg-white">
        <!-- Single Branch iframe (Hidden for showAll) -->
        <iframe id="voice-map-iframe" class="absolute inset-0 w-full h-full border-0 object-cover hidden" src=""></iframe>

        <!-- All Branches Custom Container (Simulated AJAX load) -->
        <div id="voice-custom-map-container" class="absolute inset-0 w-full h-full overflow-y-auto bg-slate-50 custom-scrollbar pb-16">
            <div class="w-full h-[500px] bg-blue-100 flex items-center justify-center border-b-4 border-yellow-500">
                 <span class="text-2xl font-bold text-blue-800">Mock Yandex Map (All Branches)</span>
            </div>
            <div class="p-6">
                <h2 class="text-xl font-bold mb-4">Список библиотек</h2>
                <ul class="space-y-4">
                    <li class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <strong class="block text-lg">Центральная городская библиотека</strong>
                        <span class="text-slate-600">Суздальский проспект, д. 2</span>
                    </li>
                    <li class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <strong class="block text-lg">Филиал № 1</strong>
                        <span class="text-slate-600">ул. Добросельская, д. 197в</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

</body>
</html>
