<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fullscreen Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; height: 2000px; background: #eee; }
    </style>
</head>
<body>
    <div id="ai-chat-window" class="hidden w-[96vw] sm:w-[90vw] md:w-[680px] max-w-full bg-white rounded-[2.5rem] shadow-2xl mb-6 flex-col h-[70vh] max-h-[750px] sm:h-[650px] pointer-events-auto">
        <div class="p-4 bg-green-700 text-white flex justify-between">
            <span>Header</span>
            <button id="fullscreen-ai-chat" class="p-1 border"><span>fullscreen</span></button>
        </div>
        <div class="flex-grow p-4">Chat content...</div>
    </div>

    <script>
        const chatWindow = document.getElementById('ai-chat-window');
        const fullscreenBtn = document.getElementById('fullscreen-ai-chat');

        function toggleFullscreen() {
            chatWindow.classList.toggle('fixed');
            chatWindow.classList.toggle('inset-0');
            chatWindow.classList.toggle('z-[99999]');
            chatWindow.classList.toggle('!h-[100dvh]');
            chatWindow.classList.toggle('!w-[100vw]');
            chatWindow.classList.toggle('!max-w-none');
            chatWindow.classList.toggle('!rounded-none');
            chatWindow.classList.toggle('!m-0');

            // Disable default dimensional classes
            chatWindow.classList.toggle('w-[96vw]');
            chatWindow.classList.toggle('sm:w-[90vw]');
            chatWindow.classList.toggle('md:w-[680px]');
            chatWindow.classList.toggle('h-[70vh]');
            chatWindow.classList.toggle('max-h-[750px]');
            chatWindow.classList.toggle('sm:h-[650px]');
            chatWindow.classList.toggle('mb-6');
            chatWindow.classList.toggle('rounded-[2.5rem]');
        }

        fullscreenBtn.addEventListener('click', () => {
            toggleFullscreen();
            const icon = fullscreenBtn.querySelector('span');
            icon.textContent = chatWindow.classList.contains('fixed') ? 'fullscreen_exit' : 'fullscreen';
        });

        // Show chat by default for test
        chatWindow.classList.remove('hidden');
    </script>
</body>
</html>
