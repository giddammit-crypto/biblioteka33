<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Toggle Accessibility Test</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .material-symbols-outlined { font-family: monospace; }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div class="mb-6">
        <!-- Button from index.php (simplified PHP) -->
         <button id="sidebar-toggle-btn" aria-controls="sidebar-column" aria-expanded="true" class="flex items-center gap-2 px-4 py-2 bg-green-700 text-white rounded-lg shadow hover:bg-opacity-90 transition-all focus:outline-none focus:ring-2 focus:ring-green-700 focus:ring-offset-2">
            <span class="material-symbols-outlined">menu_open</span>
            <span class="text-sm font-bold uppercase">Скрыть/Показать сайдбар</span>
        </button>
    </div>

    <div class="flex flex-col lg:flex-row gap-8 items-start">
        <!-- Sidebar Column -->
        <div id="sidebar-column" class="w-full lg:w-[30%] shrink-0 transition-all duration-300 bg-white p-4 h-64 border">
             Sidebar Content
        </div>

        <!-- Main Content -->
        <div id="primary" class="w-full lg:w-[70%] transition-all duration-300 bg-white p-4 h-64 border">
            Main Content
        </div>
    </div>

    <!-- Script from js/sidebar.js -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('sidebar-toggle-btn');
        const sidebar = document.getElementById('sidebar-column');
        const primary = document.getElementById('primary');

        if (!toggleBtn || !sidebar || !primary) return;

        toggleBtn.addEventListener('click', function() {
            // Toggle Sidebar visibility
            const isExpanded = sidebar.classList.contains('lg:w-[30%]');

            if (isExpanded) {
                // Hide Sidebar
                sidebar.classList.remove('lg:w-[30%]');
                sidebar.classList.add('lg:w-0', 'lg:overflow-hidden', 'lg:opacity-0', 'lg:p-0');

                // Expand Content
                primary.classList.remove('lg:w-[70%]');
                primary.classList.add('lg:w-full');

                // Update State & Icon
                toggleBtn.setAttribute('aria-expanded', 'false');
                const icon = toggleBtn.querySelector('.material-symbols-outlined');
                if (icon) icon.textContent = 'menu';
            } else {
                // Show Sidebar
                sidebar.classList.add('lg:w-[30%]');
                sidebar.classList.remove('lg:w-0', 'lg:overflow-hidden', 'lg:opacity-0', 'lg:p-0');

                // Shrink Content
                primary.classList.add('lg:w-[70%]');
                primary.classList.remove('lg:w-full');

                // Update State & Icon
                toggleBtn.setAttribute('aria-expanded', 'true');
                const icon = toggleBtn.querySelector('.material-symbols-outlined');
                if (icon) icon.textContent = 'menu_open';
            }
        });
    });
    </script>
</body>
</html>
