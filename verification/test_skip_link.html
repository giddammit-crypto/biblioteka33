<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Skip Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0b7930",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Skip Link -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 focus:z-[100] bg-white text-primary p-4 shadow-xl rounded-br-lg transition-all duration-300 font-bold border border-slate-200">Перейти к основному контенту</a>

    <header class="bg-white p-4 shadow mb-4">
        <h1 class="text-xl font-bold">Header Content</h1>
        <p>Press Tab to see the skip link.</p>
    </header>

    <main id="main-content" class="p-4 bg-white m-4 rounded shadow">
        <h2 class="text-2xl font-bold mb-2">Main Content</h2>
        <p>This is the main content area.</p>
        <button class="bg-blue-500 text-white px-4 py-2 rounded mt-2">Focusable Button</button>
    </main>
</body>
</html>
