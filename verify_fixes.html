
    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
        <link rel="stylesheet" href="wp-content/themes/city-library/style.css">
        <link rel="stylesheet" href="wp-content/themes/city-library/css/ai-chat-themes.css">
        <style>
            :root { --primary-color: #0b7930; }
        </style>
    </head>
    <body class="bg-slate-100">
        <!-- Mock News Card (Mobile View) -->
        <div class="max-w-[400px] mx-auto p-4 lg:hidden">
            <article class="group relative flex flex-col h-full bg-white rounded-[2rem] overflow-hidden shadow-xl">
                <div class="news-card-content-wrapper p-6">
                    <h3 class="text-2xl font-bold"><a href="#" class="news-card-title-link">Заголовок новости</a></h3>
                    <div class="news-card-excerpt-text"><p>Это текст анонса новости, который должен быть белым.</p></div>
                    <a href="#" class="news-card-link">Читать полностью</a>
                </div>
            </article>
        </div>

        <!-- Mock AI Chat -->
        <div id="ai-chat-window" class="fixed bottom-4 right-4 w-[400px] bg-white rounded-3xl shadow-xl flex flex-col h-[500px] border border-slate-200">
            <div id="ai-selection-toolbar" class="hidden bg-indigo-600 text-white p-3 flex justify-between items-center shrink-0">
                <span id="ai-selected-count">0</span> выбрано
                <div class="flex gap-2">
                    <button id="ai-compile-pdf" class="bg-white/20 px-2 py-1 rounded">PDF</button>
                    <button id="ai-compile-docx" class="bg-white/20 px-2 py-1 rounded">DOCX</button>
                </div>
            </div>
            <div id="ai-chat-messages" class="flex-grow p-4 overflow-y-auto flex flex-col gap-4 relative">
                <div class="ai-selectable-message bot-msg" data-index="0">
                    <div class="prose prose-sm">Текст ответа 1 <div class="flex gap-2 mt-3">Кнопки действий</div></div>
                </div>
            </div>
            <div class="p-3 border-t flex gap-2">
                <input type="text" id="ai-chat-input" class="flex-grow border rounded-full px-4">
                <button id="ai-chat-send" class="bg-primary text-white p-2 rounded-full">Send</button>
            </div>
        </div>

        <script>
            // Simple mock of selection logic
            window.isSelectionMode = false;
            document.getElementById('ai-chat-messages').addEventListener('click', (e) => {
                const toolbar = document.getElementById('ai-selection-toolbar');
                toolbar.classList.remove('hidden');
                document.getElementById('ai-selected-count').textContent = '1';
                const msg = document.querySelector('.ai-selectable-message');
                msg.style.ring = '2px solid indigo';
                msg.classList.add('bg-indigo-50');
            });
        </script>
    </body>
    </html>
