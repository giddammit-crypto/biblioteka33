<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Final Verification</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        :root { --primary-color: #0b7930; }
        body { background: #f1f5f9; padding: 20px; font-family: sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #ai-chat-window { display: flex; flex-direction: column; height: 500px; width: 400px; background: white; border-radius: 2rem; overflow: hidden; position: relative; }
        #ai-chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .prose { max-width: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ai-chat-window">
        <div class="bg-green-700 p-4 text-white flex justify-between">
            <span>Библиотекарь</span>
            <button id="fullscreen-ai-chat" class="p-1 border rounded">FS</button>
        </div>

        <div class="flex-grow flex flex-col relative overflow-hidden">
            <div id="ai-chat-messages" class="custom-scrollbar">
                <div class="h-[1000px] flex flex-col gap-4">
                    <div class="bg-white border border-slate-200 p-4 rounded-2xl relative prose prose-sm" id="msg-verified">
                        <div class="verified-badge-placeholder"></div>
                        Это длинное сообщение от ИИ, которое должно быть помечено как проверенное, так как оно содержит важные факты о библиотеке и не является ошибкой.
                    </div>
                    <div class="mt-auto">Конец чата.</div>
                </div>
            </div>
            <!-- Scroll to bottom button will be injected by JS -->
        </div>

        <div class="p-4 border-t">
            <textarea id="ai-chat-input" class="w-full border rounded-xl p-2 resize-none"></textarea>
        </div>
    </div>

    <script>
        // Mocking the logic from ai-chat.js
        const messagesContainer = document.getElementById('ai-chat-messages');
        const chatWindow = document.getElementById('ai-chat-window');
        const verifiedMessages = {};

        // Scroll to bottom logic
        const scrollToBottomBtn = document.createElement('button');
        scrollToBottomBtn.id = 'ai-scroll-bottom';
        scrollToBottomBtn.className = 'absolute bottom-20 right-4 w-10 h-10 bg-white shadow-lg border border-slate-200 rounded-full flex items-center justify-center text-primary opacity-0 pointer-events-none transition-all duration-300 hover:bg-slate-50 z-20 active:scale-90';
        scrollToBottomBtn.innerHTML = '<span class="material-symbols-outlined">expand_more</span>';
        chatWindow.querySelector('.flex-grow.flex.flex-col').appendChild(scrollToBottomBtn);

        messagesContainer.addEventListener('scroll', () => {
            const diff = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
            if (diff > 100) {
                scrollToBottomBtn.classList.remove('opacity-0', 'pointer-events-none');
                scrollToBottomBtn.classList.add('opacity-100');
            } else {
                scrollToBottomBtn.classList.add('opacity-0', 'pointer-events-none');
                scrollToBottomBtn.classList.remove('opacity-100');
            }
        });

        // Badge logic
        const msgText = document.getElementById('msg-verified').innerText;
        if (msgText.length > 50) {
            const badge = document.createElement('div');
            badge.id = 'verified-badge-element';
            badge.className = "absolute -top-2 -right-2 bg-green-500 text-white px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-tighter shadow-sm border border-white flex items-center gap-0.5 z-10";
            badge.innerHTML = '<span class="material-symbols-outlined text-[11px]">verified</span> Данные проверены';
            document.querySelector('.verified-badge-placeholder').appendChild(badge);
        }

        // FS Mock
        document.getElementById('fullscreen-ai-chat').addEventListener('click', () => {
            chatWindow.classList.toggle('fixed');
            chatWindow.classList.toggle('inset-0');
            chatWindow.style.width = chatWindow.classList.contains('fixed') ? '100vw' : '400px';
            chatWindow.style.height = chatWindow.classList.contains('fixed') ? '100vh' : '500px';
        });
    </script>
</body>
</html>
