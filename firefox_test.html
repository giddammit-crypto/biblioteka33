
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link rel="stylesheet" href="wp-content/themes/city-library/style.css">
    <style>
        :root { --primary-color: #0b7930; }
        .test-card { margin: 2rem; max-width: 400px; }
    </style>
</head>
<body class="bg-slate-100">
    <div class="test-card">
        <article class="group relative flex flex-col h-full bg-white rounded-[2rem] overflow-hidden shadow-xl aspect-[3/4]">
            <!-- Image Container -->
            <div class="absolute inset-0 z-0 h-full w-full shrink-0 overflow-hidden news-card-image-container">
                <div class="block w-full h-full bg-slate-400">
                    <div class="absolute inset-0 flex items-center justify-center text-white">Mock Image</div>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
            </div>

            <!-- Content -->
            <div class="relative z-20 flex flex-col h-full p-6 justify-end news-card-content-wrapper">
                <h3 class="text-2xl font-bold mb-3 text-white news-card-title-link">
                    Заголовок новости в Firefox
                </h3>
                <div class="text-[15px] leading-relaxed mb-4 text-white news-card-excerpt-text">
                    <p>Этот текст иногда пропадает в Firefox. Мы проверяем видимость и наложение слоев.</p>
                </div>
                <div class="pt-4 border-t border-white/20">
                    <span class="text-white news-card-link">Читать полностью</span>
                </div>
            </div>
        </article>
    </div>
</body>
</html>
